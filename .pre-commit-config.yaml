# Managed with prek (https://prek.j178.dev), a drop-in pre-commit replacement.
#   prek install       # enable the git hook (once per clone)
#   prek run --all-files
#
# Hooks are `local` so tool versions come from a single source (uv.lock for
# ruff; the Brewfile for hadolint/helm) and stay in lockstep with CI.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      - id: hadolint
        name: hadolint
        entry: hadolint
        language: system
        files: Dockerfile

      - id: helm-lint
        name: helm lint
        entry: >-
          helm lint charts/walnut --strict
          --values charts/walnut/ci/lint-values.yaml
        language: system
        files: ^charts/walnut/
        pass_filenames: false
